server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finance_user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: "finance-project-super-secret-key-2026-this-must-be-long"
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "*"